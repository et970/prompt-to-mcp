[project]
name = "prompt-to-mcp"
version = "1.0.2"
description = "Turn a prompt + API docs into a deployed, registered, Gemini-Enterprise-connected MCP server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "google-auth>=2.35",
    "google-cloud-firestore>=2.19",
    "google-cloud-secret-manager>=2.21",
    "google-cloud-storage>=2.18",
    "google-genai>=2.0",
    "PyYAML>=6.0",
    # Required by FastAPI to parse `Form(...)` parameters. The OAuth /token
    # endpoint is form-encoded per RFC 6749, so without this the app fails at
    # import time -- and only in a clean environment, which is why it survived
    # local testing and died on the first real deploy.
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The single-page UI ships inside the package so the container has exactly one
# artifact to copy and no separate asset pipeline.
#
# `runtime_src/*` is the generic MCP runtime's source, staged into the package
# by the Dockerfile. It is never imported; it is the payload of the downloadable
# package served by /v1/mcps/{id}/bundle.zip, which has to contain the code the
# user's MCP actually runs. Absent in a source checkout, where the bundler falls
# back to runtime/ in the repo.
[tool.setuptools.package-data]
prompt_to_mcp = ["static/*", "BUILD_STAMP", "runtime_src/*"]
